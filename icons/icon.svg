  <rect x="206" y="190" width="58" height="190" rx="8" fill="#17b26a"/>
  <rect x="276" y="280" width="58" height="100" rx="8" fill="#ff6b4a"/>
  <rect x="346" y="150" width="58" height="230" rx="8" fill="#17b26a"/>
  <rect x="116" y="388" width="308" height="12" rx="6" fill="#ffd23f"/>
  <text x="176" y="200" font-family="Arial, sans-serif" font-weight="800" font-size="110" fill="#ffd23f" text-anchor="middle">$</text>
</svg>
