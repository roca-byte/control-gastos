<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a3418">
  <meta name="description" content="Anotá gastos y ventas del emprendimiento y mirá cuánto deja cada producto.">
  <title>Control de Gastos</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="barra">
    <h1>Control de Gastos</h1>
  </header>

  <!-- La app redibuja #vista entera en cada cambio: es simple y con pocos datos va rápido. -->
  <main id="vista" aria-live="polite"></main>

  <nav class="pestanas" aria-label="Secciones">
    <button type="button" data-act="tab" data-tab="inicio">Inicio</button>
    <button type="button" data-act="tab" data-tab="insumos">Insumos</button>
    <button type="button" data-act="tab" data-tab="mas">Más</button>
  </nav>

  <!-- Hoja que sube desde abajo: formularios y calculadora. -->
  <div id="fondo-hoja" class="oculto" data-act="cerrar"></div>
  <section id="hoja" class="oculto" role="dialog" aria-modal="true"></section>

  <div id="aviso" role="status" class="oculto"></div>

  <script src="./js/reglas.js"></script>
  <script src="./js/calculadora.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/grafico.js"></script>
  <script src="./js/resumen.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
